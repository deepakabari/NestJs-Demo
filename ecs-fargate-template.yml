AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECS Fargate deployment for NestJS (API + Worker Service) using an existing VPC'

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Select your Default VPC

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Select at least two Subnets in your Default VPC

  EcrImageUrl:
    Type: String
    Description: The URI of the Docker image in ECR (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com/nestjs-demo:latest)

  DbHost:
    Type: String
    Description: Database host endpoint
  DbPort:
    Type: String
    Description: Database port
    Default: '3306'
  DbUsername:
    Type: String
    Description: Database username
  DbPassword:
    Type: String
    Description: Database password
    NoEcho: true
  DbName:
    Type: String
    Description: Database name
Resources:
  # ---------------------------------------------------------
  # SECURITY GROUPS
  # ---------------------------------------------------------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP traffic from the internet to ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0

  FargateContainerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow traffic from ALB to Fargate containers
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  # ---------------------------------------------------------
  # LOAD BALANCER
  # ---------------------------------------------------------
  PublicLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroup

  AlbTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckPath: /api/docs # Can be changed to a custom /health endpoint
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3

  AlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref PublicLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref AlbTargetGroup

  # ---------------------------------------------------------
  # ECS CLUSTER & IAM ROLES
  # ---------------------------------------------------------
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: nestjs-matching-engine-cluster

  EcsTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # ---------------------------------------------------------
  # CLOUDWATCH LOGS (For Debugging)
  # ---------------------------------------------------------
  EcsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/nestjs-matching-engine
      RetentionInDays: 7

  # ---------------------------------------------------------
  # API SERVICE (Fargate) - RUN_CRONS = false
  # ---------------------------------------------------------
  ApiTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: nestjs-api-task
      Cpu: 512
      Memory: 1024
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref EcsTaskExecutionRole
      ContainerDefinitions:
        - Name: nestjs-api-container
          Image: !Ref EcrImageUrl
          PortMappings:
            - ContainerPort: 3000
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: RUN_CRONS
              Value: 'false'
            - Name: DB_HOST
              Value: !Ref DbHost
            - Name: DB_PORT
              Value: !Ref DbPort
            - Name: DB_USERNAME
              Value: !Ref DbUsername
            - Name: DB_PASSWORD
              Value: !Ref DbPassword
            - Name: DB_NAME
              Value: !Ref DbName
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: AlbListener
    Properties:
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref ApiTaskDefinition
      DesiredCount: 2
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref FargateContainerSecurityGroup
          Subnets: !Ref SubnetIds
      LoadBalancers:
        - ContainerName: nestjs-api-container
          ContainerPort: 3000
          TargetGroupArn: !Ref AlbTargetGroup

  # ---------------------------------------------------------
  # WORKER SERVICE (Fargate) - RUN_CRONS = true
  # ---------------------------------------------------------
  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: nestjs-worker-task
      Cpu: 512
      Memory: 1024
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref EcsTaskExecutionRole
      ContainerDefinitions:
        - Name: nestjs-worker-container
          Image: !Ref EcrImageUrl
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: RUN_CRONS
              Value: 'true'
            - Name: DB_HOST
              Value: !Ref DbHost
            - Name: DB_PORT
              Value: !Ref DbPort
            - Name: DB_USERNAME
              Value: !Ref DbUsername
            - Name: DB_PASSWORD
              Value: !Ref DbPassword
            - Name: DB_NAME
              Value: !Ref DbName
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref EcsLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker

  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: !Ref EcsCluster
      TaskDefinition: !Ref WorkerTaskDefinition
      DesiredCount: 1 # MUST STAY AT 1 TO PREVENT CRON RACE CONDITIONS
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref FargateContainerSecurityGroup
          Subnets: !Ref SubnetIds

Outputs:
  ApiUrl:
    Description: URL of the API Load Balancer
    Value: !Join ['', ['http://', !GetAtt PublicLoadBalancer.DNSName]]
