AWSTemplateFormatVersion: '2010-09-09'
Description: Cognito User Pool for NestJS CRUD Demo application

Parameters:
  ProjectName:
    Type: String
    Description: Project prefix for resource names

  EnvironmentName:
    Type: String
    Description: Environment name (e.g., dev, staging, prod)

  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID

  GoogleClientSecret:
    Type: String
    Description: Google OAuth Client Secret
    NoEcho: true

  SESFromEmail:
    Type: String
    Description: The FROM email address for Cognito emails (must be verified in SES)

  SESRegion:
    Type: String
    Description: The AWS Region for SES

  CallbackURL:
    Type: String
    Description: OAuth callback URL

  LogoutURL:
    Type: String
    Description: OAuth logout URL

Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${EnvironmentName}-user-pool'

      # Sign-in configuration - Email only
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false

      # Self-registration enabled
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

      # Password policy
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3

      # MFA - No MFA
      MfaConfiguration: 'OFF'

      # Account recovery - Email only
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

      # Device tracking - Don't remember
      DeviceConfiguration:
        ChallengeRequiredOnNewDevice: false
        DeviceOnlyRememberedOnUserPrompt: false

      # Email configuration - Send email via SES (DEVELOPER mode for custom FROM address)
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub 'arn:aws:ses:${SESRegion}:${AWS::AccountId}:identity/${SESFromEmail}'
        From: !Ref SESFromEmail

      # ─── Verification Message (Email) ───
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: 'Verify your email - NestJS CRUD Demo'
        EmailMessage: !Sub |
          <div style="font-family: 'Inter', Arial, sans-serif; background-color: #f1f5f9; padding: 50px 20px;">
            <div style="max-width: 500px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);">
              <!-- Header -->
              <div style="background-color: #0f172a; padding: 24px; text-align: center;">
                <span style="color: #ffffff; font-size: 20px; font-weight: 700; letter-spacing: 0.5px;">__APP_TEXT__</span>
              </div>

              <!-- Content -->
              <div style="padding: 40px 32px;">
                <h2 style="color: #0f172a; font-size: 24px; font-weight: 700; margin: 0 0 16px 0;">Verify Your Email</h2>
                <span style="color: #475569; font-size: 16px; line-height: 1.6; margin: 0 0 24px 0;">Welcome to __APP_TEXT__.</span>
                <p style="color: #475569; font-size: 16px; line-height: 1; margin: 0 0 24px 0;">Please use the verification code below to secure your account.</p>

                <!-- Code Box -->
                <div style="background-color: #f8fafc; border: 2px dashed #e2e8f0; border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 24px;">
                  <span style="font-family: 'Courier New', monospace; font-size: 36px; font-weight: 800; letter-spacing: 10px; color: #0f172a;">{####}</span>
            </div>

                <p style="color: #64748b; font-size: 14px; margin: 0;">This code will expire in <strong style="color: #0f172a;">24 Hours</strong>.</p>
          </div>

              <!-- Footer -->
              <div style="background-color: #f8fafc; padding: 24px; text-align: center; border-top: 1px solid #f1f5f9;">
                <p style="color: #94a3b8; font-size: 12px; line-height: 1.5; margin: 0;">
            &copy; 2026 The Code Crafters Team<br>
            This is an automated message. Please do not reply.
                </p>
              </div>
            </div>
          </div>

      # User attributes schema
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

      # No verification needed when updating user details like email or phone_number.
      # Changes will be applied directly.
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: []

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub '${ProjectName}-${EnvironmentName}-${AWS::AccountId}'
      UserPoolId: !Ref CognitoUserPool

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref CognitoUserPool
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: 'profile email openid'
      AttributeMapping:
        email: email
        email_verified: email_verified
        given_name: given_name
        family_name: family_name

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - CognitoUserPool
      - GoogleIdentityProvider
    Properties:
      ClientName: !Sub '${ProjectName}-${EnvironmentName}-app-client'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true
      SupportedIdentityProviders:
        - COGNITO
        - Google
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
        - aws.cognito.signin.user.admin
      CallbackURLs:
        - !Ref CallbackURL
      LogoutURLs:
        - !Ref LogoutURL
      AllowedOAuthFlowsUserPoolClient: true

      # Auth flows
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      # Token validity
      AccessTokenValidity: 1 # hr
      RefreshTokenValidity: 1 # days
      TokenValidityUnits:
        AccessToken: hours
        RefreshToken: days

      # Security settings
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

      # Readable and writable attributes
      ReadAttributes:
        - email
        - email_verified
        - name
        - given_name
        - family_name
        - phone_number
      WriteAttributes:
        - email
        - name
        - given_name
        - family_name
        - phone_number

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-UserPoolId'

  UserPoolClientId:
    Description: Cognito User Pool App Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub '${ProjectName}-${EnvironmentName}-UserPoolClientId'

  UserPoolClientSecret:
    Description: Cognito User Pool App Client Secret
    Value: !GetAtt CognitoUserPoolClient.ClientSecret
