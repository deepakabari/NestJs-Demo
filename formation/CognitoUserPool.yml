AWSTemplateFormatVersion: "2010-09-09"
Description: Cognito User Pool for NestJS CRUD Demo application

Parameters:
  ProjectName:
    Type: String
    Description: Project prefix for resource names

  EnvironmentName:
    Type: String
    Description: Environment name (e.g., dev, staging, prod)

  GoogleClientId:
    Type: String
    Description: Google OAuth Client ID

  GoogleClientSecret:
    Type: String
    Description: Google OAuth Client Secret
    NoEcho: true

  SESFromEmail:
    Type: String
    Description: The FROM email address for Cognito emails (must be verified in SES)

  SESRegion:
    Type: String
    Description: The AWS Region for SES

  CallbackURL:
    Type: String
    Description: OAuth callback URL

  LogoutURL:
    Type: String
    Description: OAuth logout URL

Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${ProjectName}-${EnvironmentName}-user-pool"

      # Sign-in configuration - Email only
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false

      # Self-registration enabled
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false

      # Password policy
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
          TemporaryPasswordValidityDays: 3

      # MFA - No MFA
      MfaConfiguration: "OFF"

      # Account recovery - Email only
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

      # Device tracking - Don't remember
      DeviceConfiguration:
        ChallengeRequiredOnNewDevice: false
        DeviceOnlyRememberedOnUserPrompt: false

      # Email configuration - Send email via SES (DEVELOPER mode for custom FROM address)
      EmailConfiguration:
        EmailSendingAccount: DEVELOPER
        SourceArn: !Sub "arn:aws:ses:%{SESRegion}:${AWS::AccountId}:identity/${SESFromEmail}"
        From: !Ref SESFromEmail

      # ─── Verification Message (Email) ───
      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE
        EmailSubject: "Verify your email - NestJS CRUD Demo"
        EmailMessage: !Sub |
          <div style="font-family: 'Segoe UI', Arial, sans-serif; background-color: #F0F4F8; padding: 40px 20px;">
            <div style="max-width: 520px; margin: auto;">
              <!-- Header -->
              <div style="text-align: center; margin-bottom: 24px;">
                <h1 style="color: #1E293B; font-size: 24px; margin: 0;">🚀 NestJS CRUD Demo</h1>
              </div>
              <!-- Card -->
              <div style="background-color: #ffffff; border: 1px solid #E2E8F0; border-radius: 16px; padding: 40px 32px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05);">
                <!-- Badge -->
                <div style="display: inline-block; background-color: #DBEAFE; color: #1E40AF; padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-bottom: 24px;">
                  ✉️ Email Verification
                </div>
                <!-- Title -->
                <h2 style="color: #1E293B; margin: 0 0 12px 0; font-size: 20px;">Verify your email address</h2>
                <!-- Description -->
                <p style="color: #64748B; font-size: 14px; line-height: 1.6; margin: 0 0 24px 0;">
                  Use the verification code below to complete your registration.
                </p>
                <!-- OTP Box -->
                <div style="background-color: #F8FAFC; border: 2px dashed #CBD5E1; border-radius: 12px; padding: 24px; margin: 0 0 24px 0;">
                  <div style="font-size: 32px; font-weight: 700; letter-spacing: 8px; color: #3B82F6; font-family: 'Courier New', monospace;">
                    {####}
                  </div>
                </div>
                <!-- Expiry -->
                <p style="color: #94A3B8; font-size: 12px; margin: 0 0 8px 0;">
                  This code will expire shortly for security reasons.
                </p>
                <!-- Help -->
                <p style="color: #94A3B8; font-size: 12px; margin: 0;">
                  If you didn't request this, you can safely ignore this email.
                </p>
              </div>
              <!-- Footer -->
              <div style="text-align: center; margin-top: 24px;">
                <p style="color: #94A3B8; font-size: 11px; margin: 0;">
                  &copy; 2026 NestJS CRUD Demo. All rights reserved.
                </p>
              </div>
            </div>
          </div>

      # User attributes schema
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true

      # No verification needed when updating user details like email or phone_number.
      # Changes will be applied directly.
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate: []

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub "${ProjectName}-${EnvironmentName}-${AWS::AccountId}"
      UserPoolId: !Ref CognitoUserPool

  GoogleIdentityProvider:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Properties:
      ProviderName: Google
      ProviderType: Google
      UserPoolId: !Ref CognitoUserPool
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: "profile email openid"
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    DependsOn:
      - CognitoUserPool
      - GoogleIdentityProvider
    Properties:
      ClientName: !Sub "${ProjectName}-${EnvironmentName}-app-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: true
      SupportedIdentityProviders:
        - COGNITO
        - Google
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
        - aws.cognito.signin.user.admin
      CallbackURLs:
        - !Ref CallbackURL
      LogoutURLs:
        - !Ref LogoutURL
      AllowedOAuthFlowsUserPoolClient: true

      # Auth flows
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH

      # Token validity
      AccessTokenValidity: 1 # hr
      RefreshTokenValidity: 1 # days
      TokenValidityUnits:
        AccessToken: hours
        RefreshToken: days

      # Security settings
      EnableTokenRevocation: true
      PreventUserExistenceErrors: ENABLED

      # Readable and writable attributes
      ReadAttributes:
        - email
        - email_verified
        - name
        - given_name
        - family_name
        - phone_number
      WriteAttributes:
        - email
        - name
        - given_name
        - family_name
        - phone_number

Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-UserPoolId"

  UserPoolClientId:
    Description: Cognito User Pool App Client ID
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-UserPoolClientId"

  UserPoolClientSecret:
    Description: Cognito User Pool App Client Secret
    Value: !GetAtt CognitoUserPoolClient.ClientSecret
